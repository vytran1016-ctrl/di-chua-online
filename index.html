<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chùa Online - Trải nghiệm Tâm linh Số</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e8dcc5;
            --accent-color: #d4af37;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; font-family: 'Times New Roman', serif;
        }

        /* 1. MÀN HÌNH ĐĂNG NHẬP */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #2a2a2a 0%, #111 100%);
            z-index: 100;
        }
        #login-screen h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--accent-color); }
        #login-screen input {
            padding: 12px 20px; font-size: 1.2rem;
            border: 1px solid var(--accent-color); border-radius: 8px;
            background: transparent; color: white; margin-bottom: 20px;
            text-align: center;
        }
        #login-screen button {
            padding: 12px 30px; font-size: 1.2rem; cursor: pointer;
            background: var(--accent-color); color: #111;
            border: none; border-radius: 8px; font-weight: bold;
        }

        /* 2. GIAO DIỆN CHÍNH */
        #main-app { display: none; width: 100%; height: 100%; position: relative; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 30px; box-sizing: border-box;
        }

        /* Bảng Xếp Hạng & Thông tin User */
        .top-bar { display: flex; justify-content: space-between; pointer-events: auto; }
        .user-info { font-size: 1.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .merit-points { font-size: 2.5rem; color: var(--accent-color); font-weight: bold; }
        
        .leaderboard {
            background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px;
            border: 1px solid var(--accent-color); min-width: 250px;
            backdrop-filter: blur(5px);
        }
        .leaderboard h3 { margin: 0 0 15px 0; font-size: 1.3rem; text-align: center; border-bottom: 1px solid #555; padding-bottom: 10px; color: var(--accent-color);}
        .leaderboard ul { list-style: none; padding: 0; margin: 0; }
        .leaderboard li { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.1rem;}
        .my-rank { color: var(--accent-color); font-weight: bold; border-top: 1px dashed #555; padding-top: 10px; margin-top: 10px; }

        /* PIP Camera */
        #pip-container {
            width: 160px; height: 120px; background: #000; border-radius: 10px;
            border: 1px solid var(--accent-color); overflow: hidden; position: relative;
            align-self: flex-end; pointer-events: auto;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #skeleton-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }

        #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* 3. HIỆU ỨNG POP-UP +1 CÔNG ĐỨC */
        .merit-popup {
            position: absolute;
            color: var(--accent-color);
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 10px var(--accent-color), 0 0 20px #000;
            pointer-events: none;
            z-index: 20;
            animation: floatUp 2s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }
    </style>
</head>
<body>

    <!-- THẺ VIDEO ẨN: Đã bật autoplay để chạy liên tục làm background -->
    <video id="artwork-video" src="./buddha.mp4" loop muted playsinline crossorigin="anonymous" autoplay style="display: none;"></video>

    <div id="login-screen">
        <h1>Thành Tâm Điện</h1>
        <p>Ghi danh để tham gia Bảng Xếp Hạng Công Đức</p>
        <input type="text" id="username-input" placeholder="Pháp danh của bạn" autocomplete="off">
        <button id="start-btn">Bước vào Cửa Phật</button>
    </div>

    <div id="main-app">
        <div id="ui-layer">
            <div class="top-bar">
                <div class="user-info">
                    Thí chủ: <span id="display-name">...</span><br>
                    Công đức: <br><span id="display-merit" class="merit-points">0</span>
                </div>
                
                <div class="leaderboard">
                    <h3>Bảng Vàng Công Đức</h3>
                    <ul>
                        <li><span>1. TichQuang</span> <span>9,999</span></li>
                        <li><span>2. AnNhien</span> <span>8,500</span></li>
                        <li><span>3. ThienTam</span> <span>4,200</span></li>
                        <li class="my-rank">
                            <span id="rank-name">-</span> <span id="rank-score">0</span>
                        </li>
                    </ul>
                </div>
            </div>

            <div id="pip-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="skeleton-canvas"></canvas>
            </div>
        </div>
        <div id="webgl-container"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { HandLandmarker, FilesetResolver, DrawingUtils } from '@mediapipe/tasks-vision';

        let userName = "";
        let meritPoints = 0;
        let isPraying = false;
        let targetGlow = 0.0;
        let currentGlow = 0.0;

        document.getElementById('start-btn').addEventListener('click', () => {
            const input = document.getElementById('username-input').value.trim();
            if(!input) { alert("Xin vui lòng lưu danh trước khi vào!"); return; }
            
            userName = input;
            document.getElementById('display-name').innerText = userName;
            document.getElementById('rank-name').innerText = userName;
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            
            initSystem();
        });

        // ==========================================
        // SETUP THREE.JS & SHADER (Lớp Hào Quang)
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 10;
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('webgl-container').appendChild(renderer.domElement);

        const artworkVideo = document.getElementById('artwork-video');
        const buddhaVideoTexture = new THREE.VideoTexture(artworkVideo);
        buddhaVideoTexture.colorSpace = THREE.SRGBColorSpace;
        
        const geometry = new THREE.PlaneGeometry(16, 9); 
        let uniforms = {
            tDiffuse: { value: buddhaVideoTexture },
            uGlowProgress: { value: 0.0 } 
        };

        const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uGlowProgress;
                varying vec2 vUv;
                void main() {
                    vec4 texColor = texture2D(tDiffuse, vUv);
                    vec2 center = vec2(0.5, 0.55); 
                    float dist = distance(vUv, center);
                    
                    // Tạo viền sáng mượt mà
                    float glowIntensity = smoothstep(0.3, 0.0, dist) * uGlowProgress * 1.5;
                    vec3 glowColor = vec3(1.0, 0.85, 0.4); 
                    
                    vec3 finalColor = texColor.rgb + (glowColor * glowIntensity);
                    gl_FragColor = vec4(finalColor, texColor.a);
                }
            `
        });

        const planeMesh = new THREE.Mesh(geometry, material);
        scene.add(planeMesh);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // POP-UP & TÍNH ĐIỂM
        // ==========================================
        function spawnMeritPopup() {
            const popup = document.createElement('div');
            popup.classList.add('merit-popup');
            popup.innerText = "+1 Công Đức";
            
            const randomX = window.innerWidth / 2 + (Math.random() * 200 - 100); 
            popup.style.left = randomX + 'px';
            popup.style.top = (window.innerHeight * 0.7) + 'px';
            
            document.getElementById('ui-layer').appendChild(popup);
            setTimeout(() => { popup.remove(); }, 2000);
        }

        function addMeritPoint() {
            meritPoints++;
            document.getElementById('display-merit').innerText = meritPoints;
            document.getElementById('rank-score').innerText = meritPoints;
            spawnMeritPopup();
        }

        // ==========================================
        // MEDIAPIPE HAND TRACKING
        // ==========================================
        const video = document.getElementById('webcam');
        const pipCanvas = document.getElementById('skeleton-canvas');
        const canvasCtx = pipCanvas.getContext('2d');
        let handLandmarker;
        let lastVideoTime = -1;
        const drawingUtils = new DrawingUtils(canvasCtx);

        async function initSystem() {
            // Đảm bảo video luôn chạy liên tục
            artworkVideo.play().catch(err => console.log("Trình duyệt chặn autoplay:", err));

            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2 
            });

            navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    pipCanvas.width = video.videoWidth;
                    pipCanvas.height = video.videoHeight;
                    animate(); 
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (video.readyState >= 2) {
                let startTimeMs = performance.now();
                if (video.currentTime !== lastVideoTime) {
                    lastVideoTime = video.currentTime;
                    const results = handLandmarker.detectForVideo(video, startTimeMs);
                    
                    canvasCtx.save();
                    canvasCtx.clearRect(0, 0, pipCanvas.width, pipCanvas.height);
                    
                    if (results.landmarks && results.landmarks.length > 0) {
                        for (const landmarks of results.landmarks) {
                            drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, { color: "#d4af37", lineWidth: 2 });
                            drawingUtils.drawLandmarks(landmarks, { color: "#ffffff", lineWidth: 1, radius: 2 });
                        }

                        if (results.landmarks.length === 2) {
                            const hand1 = results.landmarks[0];
                            const hand2 = results.landmarks[1];

                            const distIndex = Math.hypot(hand1[8].x - hand2[8].x, hand1[8].y - hand2[8].y);
                            const distWrist = Math.hypot(hand1[0].x - hand2[0].x, hand1[0].y - hand2[0].y);

                            if (distIndex < 0.15 && distWrist < 0.2) {
                                // CHẮP TAY: Kích hoạt Hào Quang
                                if (!isPraying) {
                                    isPraying = true;
                                    addMeritPoint(); 
                                }
                                targetGlow = 1.0; 
                            } else if (distIndex > 0.3) {
                                // TÁCH TAY: Tắt Hào Quang
                                isPraying = false;
                                targetGlow = 0.0;
                            }
                        } else {
                            isPraying = false;
                            targetGlow = 0.0;
                        }
                    } else {
                        isPraying = false;
                        targetGlow = 0.0;
                    }
                    canvasCtx.restore();
                }
            }

            // Lerp cực nhỏ (0.02) để hào quang sáng lên và mờ đi một cách êm ái, từ từ
            currentGlow += (targetGlow - currentGlow) * 0.02;
            uniforms.uGlowProgress.value = currentGlow;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
